services:
  bot:
    build:
      context: .
    container_name: 'my-running-bot'
    # network_mode: "host" # Контейнер будет использовать интернет напрямую как обычное приложение
    # если используешь network_mode поменяй в .env DB_URL @localhost:5432 вместо @postgres:5432
    env_file:
      - .env
    command: ["python", "-u", "bot.py"]
    ports:
      - "80:80"
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    container_name: "postgres"
    image: "postgres:18"
    env_file:
      - .env
    ports:
      - "5432:5432"  # "порт_хоста : порт_контейнера"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:



